spring.application.name=help-desk
spring.datasource.url=jdbc:h2:file:./data/mydb
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=9090
spring.h2.console.enabled=true
spring.boot.admin.client.url=http://localhost:9090
management.endpoints.web.exposure.include=*
# Send traces to Zipkin server (default is localhost:9411)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

info.app.name=Ticket MS
info.app.description=Ticket Management System
info.app.version=1.0

# H2 Database configuration with caching
# Cache configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Cache configuration for H2
spring.cache.simple.expire-after-write=10m

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.myapp.desk.controllers
springdoc.paths-to-match=/api/**

# Help Desk OpenAPI Configuration
help.desk.openapi.dev-url=http://localhost:9090
help.desk.openapi.prod-url=https://help-desk-api.com